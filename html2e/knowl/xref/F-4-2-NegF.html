<div class="para" id="F-4-2-NegF-2-1-1">This figure shows three adjacent copies of the plot of the periodic velocity function from the introduction to this section, which might have a formula like <span class="process-math">\(v(t) = 1 - 1.5 \cos(t)\text{.}\)</span>  On the noted interval <span class="process-math">\([a,b]\)</span> in the first quadrant, <span class="process-math">\(v(t)\)</span> is mostly positive, but for a small portion of the interval, the velocity function drops below the <span class="process-math">\(t\)</span>-axis.  The two locations where <span class="process-math">\(v(t) = 0\)</span> within <span class="process-math">\([a,b]\)</span> are denoted by <span class="process-math">\(x = c\)</span> and <span class="process-math">\(x = d\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-2-NegF-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-4-2-NegF-2-1-2">In the leftmost image, a left Riemann sum with <span class="process-math">\(12\)</span> subintervals is shown with the rectangles plotted and sketched.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-2-NegF-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-4-2-NegF-2-1-3">In the middle image, a left Riemann sum with <span class="process-math">\(24\)</span> subintervals is shown with the rectangles plotted and sketched.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-2-NegF-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-4-2-NegF-2-1-4">In the rightmost image, on the first where <span class="process-math">\(v(t)\)</span> is  positive, <span class="process-math">\([a,c]\)</span> the area bounded by <span class="process-math">\(v(t)\)</span> and the <span class="process-math">\(t\)</span>-axis is labeled <span class="process-math">\(A_1\text{.}\)</span>  On the second interval where <span class="process-math">\(v(t)\)</span> is negative, <span class="process-math">\([c,d]\text{,}\)</span> the area bounded by <span class="process-math">\(v(t)\)</span> and the <span class="process-math">\(t\)</span>-axis is labeled <span class="process-math">\(A_2\text{.}\)</span> And on the third interval where <span class="process-math">\(v(t)\)</span> is again positive, <span class="process-math">\([d,b]\text{,}\)</span> the area bounded by <span class="process-math">\(v(t)\)</span> and the <span class="process-math">\(t\)</span>-axis is labeled <span class="process-math">\(A_3\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-2-NegF-2-1-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
