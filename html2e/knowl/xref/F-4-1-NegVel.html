<div class="para" id="F-4-1-NegVel-2-1-1">Two adjacent sets of axes are shown, each on the window <span class="process-math">\([-0.5,3.5] \times [-6,6]\text{.}\)</span>  The units on the horizontal axes in both figures are “hrs”; the units on the vertical axis in the left image are “mph”, while the units on the vertical axis in the right image are “miles”.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-1-NegVel-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-4-1-NegVel-2-1-2">On the left axes, the piecewise constant velocity function is plotted along with the area the function bounds along with the <span class="process-math">\(t\)</span>-axis.  On the interval <span class="process-math">\([0,3]\text{,}\)</span> <span class="process-math">\(v(t) = 3\)</span> for all <span class="process-math">\(t\)</span> except for <span class="process-math">\(1.5 \lt t \lt 2\text{,}\)</span> for which <span class="process-math">\(v(t) = -4\text{.}\)</span>  On the interval <span class="process-math">\([0,1.5]\text{,}\)</span> the shaded area bounded by <span class="process-math">\(v(t)\)</span> and the horizontal axis is <span class="process-math">\(A_1 = 4.5\text{;}\)</span> on the interval <span class="process-math">\([1.5,2]\text{,}\)</span> the shaded area bounded by <span class="process-math">\(v(t)\)</span> and the horizontal axis is <span class="process-math">\(A_2 = 2\text{;}\)</span> and on the interval <span class="process-math">\([2,3]\text{,}\)</span> the shaded area bounded by <span class="process-math">\(v(t)\)</span> and the horizontal axis is <span class="process-math">\(A_3 = 3\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-1-NegVel-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-4-1-NegVel-2-1-3">On the right axes, the continuous, piecewise linear position function <span class="process-math">\(s(t)\)</span> is plotted.  Its graph consists of three straight line sections that pass through the points <span class="process-math">\((0,0)\text{,}\)</span> <span class="process-math">\((1.5,4.5)\text{,}\)</span> <span class="process-math">\((2,2.5)\text{,}\)</span> and <span class="process-math">\((3,5.5)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-4-1-NegVel-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
